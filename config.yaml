# Kids Dashboard settings.  Edit, then run scripts\build.ps1 and copy
# dist\extensions\kidsdash to the Kindle (or just copy this one file over).

# Where you live: used for the clock, the weather and the season.
# Find your timezone name at https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
timezone: America/Los_Angeles
location:
  latitude: 47.6062
  longitude: -122.3321

units: fahrenheit     # fahrenheit or celsius
clock: 24h            # 12h or 24h
week_start: sunday    # sunday or monday

# Calendar feeds (private ICS links from Google Calendar, iCloud, Outlook...).
# Google: Settings > your calendar > "Secret address in iCal format".
# Each link lets anyone who has it read that calendar, so do NOT put them in
# this file (it is in git).  Put them in calendars.txt next to this file, one
# per line; calendars.txt is git-ignored and gets copied onto the Kindle.
calendars: []
calendars_file: calendars.txt

# Extra events and picture choices live in this file.
events_file: events.yaml
days_ahead: 60        # how far ahead to look for events

# Extra words that pick a picture for calendar events (word in title: picture).
# Pictures are the names in assets\manifest.txt, or files in the pictures folder.
keywords: {}
#  nana: grandma
#  rex: dog

# The child lock.  While the dashboard is showing, the touchscreen is switched
# off.  To get back to the normal Kindle, pause for two seconds, then press this
# sequence on the page-turn buttons within timeout_seconds.
# Use the "Button test" entry in KUAL to see which button is "prev" and "next".
lock:
  enabled: true
  unlock_sequence: [next, next, prev, prev]
  timeout_seconds: 10
  # Also switch off the power button (experimental).  If you get stuck, holding
  # the power button for 40 seconds always restarts the Kindle.
  grab_power_button: false

display:
  # portrait, landscape, or landscape-flipped (landscape turned the other way
  # round: if the picture comes out upside down, switch between the two).
  orientation: portrait
  full_refresh_every: 30   # do a flashing clean-up refresh every N minutes
